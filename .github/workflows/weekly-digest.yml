# 週次ダイジェスト（docs/SPEC.md §12.4）。日曜 20:00 JST = 11:00 UTC。docs/digests/YYYY-Www.md を書く。
name: weekly-digest

on:
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Digest
        id: digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/digest.py
      # API キーが無いとき、Claude を使う所は注文（requests/）にしてあるので、Claude Code のルーティンに処理してもらう（無料）
      - name: Claude を使う所をルーティンへ
        if: steps.digest.outputs.fire != ''
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: python3 scripts/fire_routine.py ${{ steps.digest.outputs.fire }}
