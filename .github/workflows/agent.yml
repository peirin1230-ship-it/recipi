# ページからの注文（requests/<id>.json）を受けて Generator を動かす（docs/SPEC.md §12.2）。
# ページが POST /repos/{owner}/{repo}/dispatches に {"event_type":"agent","client_payload":{"request_id":"req-..."}} を送ると動く。
#
# 生成の経路は Secrets で決まる（Settings → Secrets and variables → Actions）。上から順に使える物を使う:
#   ANTHROPIC_API_KEY       … Claude API（従量課金）。scripts/agent.py が直接呼ぶ
#   CLAUDE_CODE_OAUTH_TOKEN … Claude の定額契約（Pro / Max / Team）。`claude setup-token` で作る（PC のターミナルが要る）。
#                             Claude Code が .claude/skills/recipi-orders の手順で Generator を務める（API 課金なし）
#   ROUTINE_FIRE_URL + ROUTINE_FIRE_TOKEN … Claude Code のルーティン「recipi: 注文を処理」の API トリガー（claude.ai/code/routines で
#                             作れる。スマホだけで設定できる）。この workflow が呼ぶと、ルーティンのセッションが注文を処理する（API 課金なし）
# どれも無ければ注文に error を書いて終わる。
name: agent

on:
  repository_dispatch:
    types: [agent]
  workflow_dispatch:
    inputs:
      request_id:
        description: "requests/<id>.json の id"
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUEST_ID: ${{ github.event.client_payload.request_id || github.event.inputs.request_id }}
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_ROUTINE: ${{ secrets.ROUTINE_FIRE_URL != '' && secrets.ROUTINE_FIRE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull latest (ページが直前に書いた注文を取り込む)
        run: git pull --rebase -q origin ${{ github.ref_name || 'main' }} || true

      - name: Run agent (Claude API)
        if: env.HAS_API_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/agent.py auto --request "$REQUEST_ID"

      - name: Run agent (Claude Code with subscription)
        if: env.HAS_API_KEY != 'true' && env.HAS_OAUTH == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/recipi-orders ${{ env.REQUEST_ID }}"
          claude_args: "--max-turns 40"

      - name: Fire routine (Claude Code routine via API trigger)
        if: env.HAS_API_KEY != 'true' && env.HAS_OAUTH != 'true' && env.HAS_ROUTINE == 'true'
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          # Secrets に混ざった改行・空白を落とす（スマホで貼ると末尾に改行が入りやすい）
          URL=$(printf '%s' "$ROUTINE_FIRE_URL" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$ROUTINE_FIRE_TOKEN" | tr -d '[:space:]')
          code=$(curl -sS -o /tmp/fire.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$REQUEST_ID\"}") || code="000"
          echo "fire: HTTP $code"; cat /tmp/fire.json 2>/dev/null; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            python3 - "$code" <<'PY'
          import os, sys
          sys.path.insert(0, "scripts"); import common
          rid = os.environ["REQUEST_ID"]
          req = common.read_json(f"requests/{rid}.json") or {"id": rid}
          code = sys.argv[1]
          why = {"000": "URL が不正（Secrets の ROUTINE_FIRE_URL を確認）", "401": "トークンが違う（ROUTINE_FIRE_TOKEN を確認。Regenerate したら貼り直す）", "404": "URL のルーティン id が違う"}.get(code, f"HTTP {code}")
          req.update({"status": "error", "error": f"ルーティンを呼べなかった: {why}。claude.ai/code/routines の API トリガーと Secrets の ROUTINE_FIRE_URL / ROUTINE_FIRE_TOKEN を確認"})
          common.write_json(f"requests/{rid}.json", req)
          common.git_commit_push([f"requests/{rid}.json"], f"agent: {rid} error (routine fire failed) [skip ci]")
          PY
            exit 1
          fi

      - name: No credentials
        if: env.HAS_API_KEY != 'true' && env.HAS_OAUTH != 'true' && env.HAS_ROUTINE != 'true'
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts"); import common
          rid = os.environ["REQUEST_ID"]
          req = common.read_json(f"requests/{rid}.json") or {"id": rid}
          req.update({"status": "error", "error": "生成の設定がまだ無い。README の「レシピ生成の設定」のとおり、ルーティンの API トリガーの URL とトークンを Secrets（ROUTINE_FIRE_URL / ROUTINE_FIRE_TOKEN）に登録する"})
          common.write_json(f"requests/{rid}.json", req)
          common.git_commit_push([f"requests/{rid}.json"], f"agent: {rid} error (no credentials) [skip ci]")
          PY
