# equipment.yml — 家の調理器具（docs/SPEC.md §6.2）。Generator はここに無い道具を使わない。
# note: は Generator にそのまま渡る。「右は火力が強い」「強火は焦げる」など、うちの癖を書く。
# 2026-10-09: 実際にある物に合わせて整理（フライパン・鍋・低温調理器・ぶんぶんチョッパー・スライサー 1.2mm・包丁）。
#   コンロ・レンジ・炊飯器・食洗機は kaji-quest の記録（五徳の掃除、レンジの庫内、米を研いで炊く、食洗機用洗剤の補充）から推定。無ければ消す。
#   フライパンと鍋の大きさは推定（26cm / 20cm）。違えば size_cm を直す。
#
#   heat: コンロ。type は gas / ih。levels は火加減の表記（gas: 弱火/中火/強火、ih: 1-9 など）
#   appliances: 家電。type は microwave / rice_cooker / dishwasher / sous_vide / toaster_oven / kettle / oven / pressure_cooker / multi_cooker / blender
#   cookware: 鍋・フライパン・ボウル。dishwasher: false は食洗機に入れない物
#   tools: 手で使う道具。tool_notes: その道具の使いどころ（Generator に渡る）
#   missing: 無い物を明示する。レシピから除外される
#   preferences: 生成のときの好み

heat:
  - { id: gas-r, type: gas, label: ガスコンロ右, levels: "弱火 / 中火 / 強火", note: "炒め物・焼き物。強火は焦げやすいので中火が上限の目安" }
  - { id: gas-l, type: gas, label: ガスコンロ左, levels: "弱火 / 中火 / 強火", note: "汁物・煮物・茹でる" }

appliances:
  - { id: microwave, type: microwave, watts: 600, note: "W 数は推定。違えば直す" }
  - { id: rice-cooker, type: rice_cooker, capacity_go: 5, normal_minutes: 50, fast_minutes: 28, note: "時間は推定" }
  - { id: sous-vide, type: sous_vide, label: 低温調理器, note: "鶏むね・ささみ・豚ロースをしっとり仕上げる。1 時間以上かかるので『仕込み』向き。夕食の 25 分には収まらない。温度と時間は knowledge/basics/07_sous_vide.md の表を守る" }
  - { id: dishwasher, type: dishwasher, note: "フライパンと鍋は入らない前提。入るなら cookware の dishwasher を true に" }

cookware:
  - { id: fp26, type: frying_pan, label: フライパン, size_cm: 26, lid: true, material: fluoro, dishwasher: false, note: "大きさは推定" }
  - { id: pot20, type: pot, label: 鍋, size_cm: 20, liters: 3.0, lid: true, dishwasher: false, note: "大きさは推定" }
  - { id: bowl-l, type: bowl, label: ボウル（大）, note: "耐熱ならレンジ可", dishwasher: true }
  - { id: bowl-m, type: bowl, label: ボウル（中）, note: "耐熱ならレンジ可", dishwasher: true }

tools: [包丁, まな板, ぶんぶんチョッパー, スライサー 1.2mm, 菜箸, お玉, フライ返し, 計量スプーン, ザル, ラップ]
tool_notes:
  - "ぶんぶんチョッパー（ブラウン）: 玉ねぎ・にんじん・キャベツのみじん切りが 30 秒で終わる。ハンバーグ・そぼろ・ミートソース・ドレッシングの下ごしらえに使う。prep の見込みを短くできる"
  - "スライサー 1.2mm（ニトリ）: 玉ねぎ・きゅうり・にんじん・大根の薄切り。サラダ・マリネ・炒め物・汁物の具の時短。指を守るため最後の 2cm は包丁で"
  - "低温調理器: 鶏むね 300g を袋に入れて 63℃ で 1 時間 30 分、などの仕込みに。できた物は 2 日以内に食べる"
storage: [保存容器, 冷凍用保存袋, ラップ]

missing: [オーブン, トースター, 圧力鍋, ミキサー, ホットクック, 揚げ物鍋, 魚焼きグリル, 電気ケトル]

preferences:
  avoid_deep_fry: true        # 揚げ物を提案しない（片付けの理由）
  max_pans_at_once: 2         # 同時に火にかける鍋・フライパンの上限
